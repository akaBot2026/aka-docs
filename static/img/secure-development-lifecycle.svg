<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" rx="10" fill="#f7fafc"/>

  <!-- Phase headers -->
  <rect x="15" y="20" width="215" height="46" rx="8" fill="#3182ce"/>
  <text x="122.5" y="50" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Plan</text>
  <rect x="260" y="20" width="215" height="46" rx="8" fill="#2b6cb0"/>
  <text x="367.5" y="50" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Build</text>
  <rect x="505" y="20" width="215" height="46" rx="8" fill="#dd6b20"/>
  <text x="612.5" y="50" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Verify</text>
  <rect x="750" y="20" width="215" height="46" rx="8" fill="#38a169"/>
  <text x="857.5" y="50" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Release</text>

  <line x1="232" y1="43" x2="258" y2="43" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="477" y1="43" x2="503" y2="43" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="722" y1="43" x2="748" y2="43" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- PLAN -->
  <rect x="15" y="86" width="215" height="100" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="122.5" y="116" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Roles and training</text>
  <text x="122.5" y="144" text-anchor="middle" fill="#4a5568" font-size="14">Defined security roles</text>
  <text x="122.5" y="164" text-anchor="middle" fill="#4a5568" font-size="14">Developer training</text>

  <rect x="15" y="200" width="215" height="110" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="122.5" y="228" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Security requirements</text>
  <text x="122.5" y="247" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">and design</text>
  <text x="122.5" y="275" text-anchor="middle" fill="#4a5568" font-size="14">Design review and</text>
  <text x="122.5" y="295" text-anchor="middle" fill="#4a5568" font-size="14">threat modeling</text>

  <!-- BUILD -->
  <rect x="260" y="86" width="215" height="100" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="367.5" y="116" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Secure coding</text>
  <text x="367.5" y="144" text-anchor="middle" fill="#4a5568" font-size="14">Recognized standards</text>
  <text x="367.5" y="164" text-anchor="middle" fill="#4a5568" font-size="14">Mandatory peer review</text>

  <rect x="260" y="200" width="215" height="100" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="367.5" y="230" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Source protection</text>
  <text x="367.5" y="258" text-anchor="middle" fill="#4a5568" font-size="14">Secret scanning</text>
  <text x="367.5" y="278" text-anchor="middle" fill="#4a5568" font-size="14">Protected main branches</text>

  <rect x="260" y="314" width="215" height="100" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="367.5" y="344" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Third-party components</text>
  <text x="367.5" y="372" text-anchor="middle" fill="#4a5568" font-size="14">Managed centrally</text>
  <text x="367.5" y="392" text-anchor="middle" fill="#4a5568" font-size="14">Scanned for vulnerabilities</text>

  <!-- VERIFY -->
  <rect x="505" y="86" width="215" height="100" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="612.5" y="116" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Security testing</text>
  <text x="612.5" y="144" text-anchor="middle" fill="#4a5568" font-size="14">Static, dependency, dynamic</text>
  <text x="612.5" y="164" text-anchor="middle" fill="#4a5568" font-size="14">and penetration testing</text>

  <rect x="505" y="200" width="215" height="100" rx="8" fill="#ffffff" stroke="#dd6b20" stroke-width="2.5"/>
  <text x="612.5" y="230" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Release control</text>
  <text x="612.5" y="258" text-anchor="middle" fill="#4a5568" font-size="14">Blocked while critical or</text>
  <text x="612.5" y="278" text-anchor="middle" fill="#4a5568" font-size="14">high findings remain open</text>

  <!-- RELEASE -->
  <rect x="750" y="86" width="215" height="100" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="857.5" y="116" text-anchor="middle" fill="#1a202c" font-size="16" font-weight="700">Release integrity</text>
  <text x="857.5" y="144" text-anchor="middle" fill="#4a5568" font-size="14">Automated builds</text>
  <text x="857.5" y="164" text-anchor="middle" fill="#4a5568" font-size="14">Digital signature, checksum</text>

  <!-- connector to band -->
  <line x1="857.5" y1="186" x2="857.5" y2="446" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- After release -->
  <rect x="15" y="450" width="950" height="72" rx="8" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1.5"/>
  <text x="490" y="479" text-anchor="middle" fill="#2c5282" font-size="17" font-weight="700">Vulnerability response</text>
  <text x="490" y="504" text-anchor="middle" fill="#2d3748" font-size="14">Assess reported vulnerabilities  ·  Prioritize and patch  ·  Notify Customers  ·  Support current and previous major versions</text>
</svg>
